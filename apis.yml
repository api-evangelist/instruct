name: Instruct
description: 'Instruct ("AI that works for you") is an AI automation platform that lets
  non-technical users delegate repetitive work across their connected applications.
  Users describe a task in natural language and Instruct''s AI pulls context from one
  integrated app, acts on it in another, and can turn any successful one-off task into
  a recurring scheduled workflow, spanning use cases across education, recruiting, sales,
  and operations. It is a hosted end-user application with a free plan and Google/email
  sign-up. As of this profile Instruct does not publish a public developer API, SDKs,
  or developer documentation. Instruct is backed by Creandum.'
